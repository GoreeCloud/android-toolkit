name: Android toolkit validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tooling tests
        run: python -m unittest discover -s tests -v
      - name: Audit tracked public files
        run: python tools/audit_tracked.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform from hosted runner
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify Java core and compile Android AAR, instrumentation APK, and internal consumer
        run: gradle :sdk-core:verifyCore :sdk-core:jar :android-kit:assembleDebug :android-kit:assembleDebugAndroidTest :consumer-smoke:assembleDebug --no-daemon --stacktrace
      - name: Verify JAR and AAR public class packaging
        run: python tools/check_binaries.py --core sdk-core/build/libs/sdk-core-0.1.0-dev.jar --aar android-kit/build/outputs/aar/android-kit-debug.aar
      - name: Compile independent Gradle composite consumer
        run: gradle -p examples/standalone-consumer :app:assembleDebug --no-daemon --stacktrace
